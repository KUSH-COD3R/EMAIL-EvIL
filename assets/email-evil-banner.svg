<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">EMAIL-EvIL — one inbox, many aliases</title>
  <desc id="desc">A neon email banner with an envelope and colorful randomized plus-address aliases.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10152d"/><stop offset="1" stop-color="#251449"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#c4b5fd" opacity=".18"/></pattern>
  </defs>
  <rect width="1500" height="500" rx="28" fill="url(#bg)"/><rect width="1500" height="500" rx="28" fill="url(#dots)"/>
  <circle cx="1240" cy="150" r="190" fill="#7c3aed" opacity=".12"/><circle cx="1040" cy="430" r="160" fill="#06b6d4" opacity=".1"/>
  <path d="M0 410 C260 330 380 520 670 420 S1120 330 1500 430" fill="none" stroke="#a78bfa" stroke-width="2" opacity=".2"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="94" y="82" width="178" height="34" rx="17" fill="#312e81" stroke="#818cf8" stroke-opacity=".6"/>
    <text x="183" y="105" fill="#c4b5fd" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">PYTHON • EMAIL TOOL</text>
    <text x="90" y="220" fill="#fff" font-size="72" font-weight="800" letter-spacing="-2">EMAIL-EvIL</text>
    <text x="94" y="276" fill="#cbd5e1" font-size="27" font-weight="500">One inbox. Many aliases. More control.</text>
    <text x="96" y="334" fill="#94a3b8" font-size="19">Generate plus-addresses for every lane of life.</text>
    <g transform="translate(96 380)"><rect width="192" height="42" rx="21" fill="#0e7490" opacity=".9"/><text x="96" y="27" fill="#ecfeff" font-size="16" font-weight="700" text-anchor="middle">alex+anything@…</text></g>
  </g>
  <g transform="translate(850 94) rotate(-8 260 150)" filter="url(#glow)" opacity=".85">
    <rect x="0" y="0" width="390" height="258" rx="24" fill="#172554" stroke="#67e8f9" stroke-opacity=".45" stroke-width="2"/>
    <path d="M5 22 Q5 5 24 5 H366 Q385 5 385 24 V73 L195 204 5 73Z" fill="#1e3a8a" opacity=".75"/>
    <path d="M6 69 195 203 384 69" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 235 135 126 M384 235 255 126" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" opacity=".9"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="600">
    <g transform="translate(1070 52) rotate(7)"><rect width="285" height="56" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/><circle cx="24" cy="28" r="7" fill="#c084fc"/><text x="44" y="34" fill="#f5f3ff">alex+travel@…</text></g>
    <g transform="translate(1135 320) rotate(-5)"><rect width="300" height="56" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/><circle cx="24" cy="28" r="7" fill="#34d399"/><text x="44" y="34" fill="#ecfdf5">alex+receipts@…</text></g>
    <g transform="translate(770 370) rotate(4)"><rect width="315" height="56" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/><circle cx="24" cy="28" r="7" fill="#fbbf24"/><text x="44" y="34" fill="#fffbeb">alex+newsletters@…</text></g>
  </g>
  <circle cx="1390" cy="150" r="4" fill="#67e8f9"/><circle cx="800" cy="112" r="5" fill="#c084fc"/><circle cx="1010" cy="60" r="3" fill="#fbbf24"/>
</svg>
