<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">EMAIL-EvIL — the mischievous mailbox</title>
  <desc id="desc">A playful, spooky email banner with a grinning mailbox, mischievous envelope, and plus-address examples.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171014"/><stop offset="1" stop-color="#351619"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff623d"/><stop offset="1" stop-color="#c51f3a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9e38"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffb36b" opacity=".15"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1500" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1500" height="500" rx="28" fill="url(#dots)"/>
  <path d="M0 390 C250 310 420 480 700 390 S1170 330 1500 410" fill="none" stroke="#ff623d" stroke-width="2" opacity=".24"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="90" y="78" width="190" height="36" rx="18" fill="#4b1720" stroke="#ff7952" stroke-opacity=".8"/>
    <text x="185" y="102" fill="#ffd166" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">THE MISCHIEF MAILBOX</text>
    <text x="86" y="216" fill="#fff4e8" font-size="74" font-weight="900" letter-spacing="-3">EMAIL-EvIL</text>
    <text x="92" y="270" fill="#ffb36b" font-size="27" font-weight="600">You've got mail... and it's a little evil!</text>
    <text x="94" y="322" fill="#e8c9b9" font-size="19">One inbox. Clever aliases. No actual mail-sending tricks.</text>
    <g transform="translate(94 366)">
      <rect width="235" height="44" rx="22" fill="#5b1d22" stroke="#ff8053"/>
      <text x="117" y="28" fill="#fff0dd" font-size="16" font-weight="700" text-anchor="middle">PLUS-ADDRESS ALIASES</text>
    </g>
  </g>
  <!-- Cartoon mailbox -->
  <g transform="translate(930 112)" filter="url(#glow)">
    <path d="M52 93a108 108 0 0 1 216 0v144H52Z" fill="url(#red)" stroke="#ffad66" stroke-width="5"/>
    <rect x="38" y="220" width="244" height="34" rx="10" fill="#84232b" stroke="#ffad66" stroke-width="4"/>
    <path d="M126 254h68l25 135h-32l-27-105-27 105h-32z" fill="#8c5a3b" stroke="#d99a62" stroke-width="4"/>
    <rect x="95" y="136" width="130" height="74" rx="12" fill="#28151a" stroke="#ffbd77" stroke-width="4"/>
    <path d="M106 149l54 40 54-40" fill="none" stroke="#ffb75a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="129" cy="105" r="8" fill="#fff2bd"/><circle cx="194" cy="105" r="8" fill="#fff2bd"/>
    <path d="M128 119q33 28 67 0" fill="none" stroke="#351014" stroke-width="8" stroke-linecap="round"/>
    <path d="M266 105v-76h18v76" fill="none" stroke="#ffd166" stroke-width="9" stroke-linecap="round"/>
    <path d="M284 31h58v40h-58" fill="#ff7b45" stroke="#ffd166" stroke-width="4"/>
    <text x="313" y="57" fill="#fff5e8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">MAIL!</text>
  </g>
  <!-- Playful alias slips -->
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" font-weight="700">
    <g transform="translate(780 68) rotate(-7)"><rect width="250" height="48" rx="12" fill="#26171b" stroke="#ff9e38" stroke-width="2"/><text x="18" y="30" fill="#ffd166">you+snacks@example.com</text></g>
    <g transform="translate(1150 355) rotate(5)"><rect width="285" height="48" rx="12" fill="#26171b" stroke="#ff623d" stroke-width="2"/><text x="16" y="30" fill="#ffb3a0">you+news@example.com</text></g>
  </g>
  <g fill="#ffbd77"><circle cx="690" cy="112" r="4"/><circle cx="1404" cy="154" r="5"/><circle cx="753" cy="348" r="3"/><path d="M1375 95l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/></g>
</svg>
