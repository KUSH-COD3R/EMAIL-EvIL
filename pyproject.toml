[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-evil"
version = "0.3.0"
description = "Generate plus-address email aliases for inbox organization."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "KUSH-COD3R" }]
dependencies = []

[project.scripts]
email-evil = "email_evil.cli:main"

[tool.setuptools]
packages = ["email_evil"]
py-modules = ["email_aliases"]
